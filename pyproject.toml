[project]
name = "podtrans"
version = "0.1.0"
description = "AI-powered podcast translation pipeline: English podcast → Chinese podcast with speaker diarization"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PodTrans Contributors" }
]
keywords = ["podcast", "translation", "asr", "tts", "ai", "whisperx", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "typer[all]>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Logging and progress
    "loguru>=0.7.3",
    "rich>=13.9.0",

    # ASR
    "torch>=2.0.0,<2.5.0",  # Pin to avoid incompatibility
    "torchaudio>=2.0.0,<2.5.0",  # Pin to avoid incompatibility with pyannote
    "whisperx>=3.1.0",
    "pyannote.audio>=3.1.0",

    # Translation
    "openai>=1.58.0",
    "tiktoken>=0.8.0",  # Token counting for smart batching

    # TTS
    "httpx>=0.27.0",  # HTTP client for TTS API calls

    # Audio processing
    "pydub>=0.25.1",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",

    # Data processing
    "orjson>=3.10.0",

    # Environment variables
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",

    # Code quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",

    # Type stubs
    "types-requests",
]

[project.scripts]
podtrans = "podtrans.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "Q",   # flake8-quotes
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Allow function calls in argument defaults (required for Typer)
    "B904",  # Allow raise without from in exception handlers
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "whisperx.*",
    "pyannote.*",
    "pydub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/podtrans --cov-report=html --cov-report=term"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]
